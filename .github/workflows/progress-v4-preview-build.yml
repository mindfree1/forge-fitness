name: Progress v4 Preview APK

on:
  push:
    branches:
      - feature/progress-v4
    paths:
      - .github/workflows/progress-v4-preview-build.yml
  workflow_dispatch:

jobs:
  eas-preview-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Expo token is configured
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is not configured."
            exit 1
          fi

      - name: Build preview APK with EAS
        run: npx eas-cli@latest build --platform android --profile preview --non-interactive --wait --json
