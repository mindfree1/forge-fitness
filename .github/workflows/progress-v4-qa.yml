name: Progress v4 QA

on:
  push:
    branches:
      - feature/progress-v4
  pull_request:
    branches:
      - feature/training-programs-v3

jobs:
  android-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor@latest

      - name: Android export
        run: npx expo export --platform android --output-dir dist/android
