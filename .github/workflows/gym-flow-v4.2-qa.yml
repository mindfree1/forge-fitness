name: Gym Flow v4.2 QA

on:
  push:
    branches:
      - feature/gym-flow-v4.2
  pull_request:
    branches:
      - feature/goals-v4.1

jobs:
  android-static-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Expo Doctor (advisory)
        continue-on-error: true
        run: npx expo-doctor@latest

      - name: Android export
        run: npx expo export --platform android --output-dir dist/android-v4-2
